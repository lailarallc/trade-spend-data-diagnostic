name: golden

# Gates the demo golden lock: runs ONLY tests/test_demo_golden.py, which pins
# the current revenue figure at the SQL-header level (and, when the workbook
# artifact is present, the Executive Pulse D11 cell). The workbook is not
# committed, so in CI the workbook cell test skips and the SQL-header assertion
# runs — both green. openpyxl comes from requirements.txt; pytest is added here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Demo golden lock
        run: python -m pytest tests/test_demo_golden.py -q
